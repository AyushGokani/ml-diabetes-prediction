<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Predictor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 440px;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        h1 { color: #2d6a4f; font-size: 24px; }
        .logout { font-size: 13px; color: #888; text-decoration: none; }
        .logout:hover { color: #c0392b; }
        .welcome { font-size: 14px; color: #888; margin-bottom: 28px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #444; font-weight: bold; }
        input[type="number"] {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-size: 15px; margin-bottom: 18px; outline: none; transition: border 0.2s;
        }
        input[type="number"]:focus { border-color: #2d6a4f; }
        .radio-group { display: flex; gap: 20px; margin-bottom: 24px; font-size: 15px; align-items: center; }
        .radio-group input { width: auto; margin: 0 6px 0 0; }
        button {
            width: 100%; padding: 13px; background: #2d6a4f; color: white;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #1b4332; }
        .result {
            margin-top: 24px; padding: 16px; border-radius: 8px; text-align: center;
            font-size: 20px; font-weight: bold;
        }
        .result.yes { background: #ffe0e0; color: #c0392b; }
        .result.no  { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>Diabetes Predictor</h1>
            <a href="{{ url_for('logout') }}" class="logout">Logout</a>
        </div>
        <p class="welcome">Welcome, {{ current_user.username }}</p>

        <form method="POST">
            <label>Fasting Sugar Level (mg/dL)</label>
            <input type="number" step="any" placeholder="e.g. 120" name="fs" required />

            <label>Frequent Urination?</label>
            <div class="radio-group">
                <label><input type="radio" name="fu" value="no" checked /> No</label>
                <label><input type="radio" name="fu" value="yes" /> Yes</label>
            </div>

            <button type="submit">Predict</button>
        </form>

        {% if m is not none %}
            <div class="result {{ 'yes' if m == 'YES' else 'no' }}">
                {% if m == "YES" %}
                    Diabetes Detected
                {% else %}
                    No Diabetes Detected
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
