<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - Diabetes Predictor</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background: #f0f4f8; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card {
            background: white; padding: 40px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 100%; max-width: 420px;
        }
        h1 { text-align: center; color: #2d6a4f; margin-bottom: 8px; font-size: 26px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 28px; font-size: 14px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #444; font-weight: bold; }
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px;
            font-size: 15px; margin-bottom: 18px; outline: none; transition: border 0.2s;
        }
        input:focus { border-color: #2d6a4f; }
        button {
            width: 100%; padding: 13px; background: #2d6a4f; color: white;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: #1b4332; }
        .footer { text-align: center; margin-top: 20px; font-size: 14px; color: #555; }
        .footer a { color: #2d6a4f; text-decoration: none; font-weight: bold; }
        .alert { padding: 10px 14px; border-radius: 8px; margin-bottom: 16px; font-size: 14px; }
        .alert.error { background: #ffe0e0; color: #c0392b; }
        .alert.success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Diabetes Predictor</h1>
        <p class="subtitle">Create a new account</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST">
            <label>Username</label>
            <input type="text" name="username" placeholder="Choose a username" required />
            <label>Email</label>
            <input type="email" name="email" placeholder="Enter your email" required />
            <label>Password</label>
            <input type="password" name="password" placeholder="Create a password" required />
            <label>Confirm Password</label>
            <input type="password" name="confirm" placeholder="Repeat your password" required />
            <button type="submit">Create Account</button>
        </form>

        <div class="footer">
            Already have an account? <a href="{{ url_for('login') }}">Login</a>
        </div>
    </div>
</body>
</html>
